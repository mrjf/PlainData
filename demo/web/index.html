<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlainData Studio</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M4 3h6.5a6.5 6.5 0 0 1 0 13H4z M7.5 6.2v6.6h3a3.3 3.3 0 0 0 0-6.6z" fill="currentColor" fill-rule="evenodd" />
        </svg>
        <h1>PlainData Studio</h1>
      </div>
      <div class="status" id="status" role="status" aria-live="polite" data-phase="synced">
        <span class="indicator" aria-hidden="true"></span>
        <span id="status-text">Synced</span>
        <span class="status-meta" id="status-meta"></span>
      </div>
      <div class="actions">
        <label class="select-wrap">
          <span class="sr-only">Example</span>
          <select id="example-select" aria-label="Load example">
            <option value="display-settings">DisplaySettings</option>
            <option value="order">Order</option>
            <option value="exact-numbers">ExactNumbers</option>
          </select>
        </label>
        <button type="button" id="format-btn">Format</button>
        <button type="button" id="reset-btn" class="quiet">Reset</button>
      </div>
    </header>

    <main class="grid">
      <section class="pane" id="pane-plain">
        <header>
          <h2>PlainData</h2>
          <span class="hint">Editable; syncs losslessly with JSON</span>
        </header>
        <div class="editor code">
          <textarea id="plain-input" spellcheck="false" aria-label="PlainData source"></textarea>
        </div>
        <div class="tokens-bar" id="tokens-bar" hidden></div>
        <footer class="notes" id="plain-notes"></footer>
      </section>

      <section class="pane" id="pane-formatted">
        <header>
          <h2>Formatted PlainData</h2>
          <span class="badge ok" id="compile-badge">Valid</span>
        </header>
        <div class="view reader" id="formatted-view"></div>
      </section>

      <section class="pane" id="pane-json">
        <header>
          <h2>JSON</h2>
          <div class="pane-controls">
            <label class="inline-field">
              <span>Concept</span>
              <input id="concept-input" type="text" value="DisplaySettings" spellcheck="false" />
            </label>
            <button type="button" id="copy-json" class="pane-btn">Copy</button>
          </div>
        </header>
        <div class="editor code">
          <textarea id="json-input" spellcheck="false" aria-label="JSON source"></textarea>
        </div>
        <footer class="notes" id="json-notes"></footer>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
